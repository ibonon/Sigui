# ── Sigui v3.0 — Docker Compose ───────────────────────────────────────────
# One-command deployment: docker compose up --build
#
# Services:
#   sigui  — FastAPI backend (port 8000)
#   demo-ui    — Next.js command center (port 3001)
#
# Volumes:
#   sigui_db   — SQLite persistence (survives restarts)
#   sigui_logs — Rotating log files

services:

  # ── Sigui Backend ───────────────────────────────────────────────────────
  sigui:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sigui:3.0.0
    container_name: sigui-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DB and log paths to use Docker volumes
      - DB_PATH=/app/db/sigui.db
      - ECOSYSTEM_METRICS_PATH=/app/ecosystem/metrics.json
      - DEMO_REPORT_PATH=/app/ecosystem/demo_report.json
    volumes:
      - sigui_db:/app/db
      - sigui_logs:/app/logs
      - sigui_ecosystem:/app/ecosystem
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - sigui_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Demo UI (Next.js Command Center) ────────────────────────────────────────
  demo-ui:
    build:
      context: ./demo-ui
      dockerfile: Dockerfile
    image: sigui-ui:3.0.0
    container_name: sigui-ui
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      # Allow the browser to reach the API directly (adjust if behind a proxy)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      sigui:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sigui_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"


# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  sigui_db:
    driver: local
    labels:
      com.sigui.description: "SQLite database — MemoClaw persistent memory"
  sigui_logs:
    driver: local
    labels:
      com.sigui.description: "Rotating log files"
  sigui_ecosystem:
    driver: local
    labels:
      com.sigui.description: "Ecosystem metrics and demo report JSON"


# ── Network ───────────────────────────────────────────────────────────────────
networks:
  sigui_net:
    driver: bridge
    labels:
      com.sigui.description: "Internal network — sigui ↔ demo-ui"
