[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigui-sdk"
version = "0.1.0"
description = "Python SDK for Sigui Protocol — Autonomous Security for the Agentic Economy"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sigui Protocol" }]
keywords = ["ai", "agents", "security", "usdc", "web3", "x402", "arc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.3.0", "langchain-core>=0.3.0"]
crewai    = ["crewai>=0.80.0"]
circle    = []  # No extra deps — uses subprocess to call the Node.js Circle script
dev       = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",        # HTTP mocking for tests
    "black",
    "ruff",
]

[project.urls]
Homepage      = "https://sigui.io"
Documentation = "https://docs.sigui.io"
Repository    = "https://github.com/diass/Sigui"
Issues        = "https://github.com/diass/Sigui/issues"

[tool.hatch.build.targets.wheel]
packages = ["sigui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
