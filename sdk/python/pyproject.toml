[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigui-sdk"
version = "0.2.0"
description = "Python SDK for Sigui Protocol — Autonomous Security for the Agentic Economy"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sigui Protocol", email = "sdk@sigui.io" }]
keywords = [
    "ai", "agents", "security", "usdc", "web3", "x402", "arc",
    "langchain", "langgraph", "crewai", "autogen", "openai-agents",
    "smolagents", "agentic", "depin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "typer>=0.12.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
# ── Framework integrations ─────────────────────────────────────────────────
langchain     = ["langchain>=0.3.0", "langchain-core>=0.3.0"]
langgraph     = ["langgraph>=0.2.0", "langchain-core>=0.3.0"]
crewai        = ["crewai>=0.80.0"]
openai-agents = ["openai-agents>=0.0.5"]
autogen       = ["autogen-agentchat>=0.4.0", "autogen-core>=0.4.0"]
smolagents    = ["smolagents>=1.0.0"]
llamaindex    = ["llama-index>=0.10.0"]
google_adk    = ["google-adk>=0.1.0"]


# ── Payment backends ───────────────────────────────────────────────────────
circle        = []  # Uses subprocess → Node.js Circle script (no extra Python dep)

# ── Install all integrations at once ─────────────────────────────────────
all = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "crewai>=0.80.0",
    "openai-agents>=0.0.5",
    "autogen-agentchat>=0.4.0",
    "autogen-core>=0.4.0",
    "smolagents>=1.0.0",
    "llama-index>=0.10.0",
    "google-adk>=0.1.0"
]

# ── Development ───────────────────────────────────────────────────────────
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "black",
    "ruff",
    "mypy>=1.10",
    "twine>=5.0",
    "build>=1.2",
]

[project.scripts]
sigui = "sigui.cli.main:app"


[project.urls]
Homepage      = "https://sigui.io"
Documentation = "https://docs.sigui.io"
Repository    = "https://github.com/diass/Sigui"
Issues        = "https://github.com/diass/Sigui/issues"
Changelog     = "https://github.com/diass/Sigui/blob/main/sdk/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["sigui"]

[tool.hatch.build.targets.sdist]
include = [
    "sigui/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]

[tool.ruff]
line-length    = 100
target-version = "py311"
select         = ["E", "F", "I", "UP", "B"]
ignore         = ["E501"]

[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true
