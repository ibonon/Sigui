<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sigui Protocol | Omnichain Oracle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold:    #F5A623;
      --amber:   #EB8C0A;
      --ivory:   #FDF6E3;
      --warm:    #FAEBD7;
      --bg:      #0A0A0B;
      --surface: rgba(245, 166, 35, 0.06);
      --border:  rgba(245, 166, 35, 0.2);
      --muted:   rgba(253, 246, 227, 0.45);
      --mono:    'IBM Plex Mono', monospace;
      --sans:    'Inter', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ivory);
      font-family: var(--sans);
    }

    /* ── Wave Canvas ── */
    #wave-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Vignette overlay ── */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(10,10,11,0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ── Main layout ── */
    .scene {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 0 24px;
    }

    /* ── Header mark ── */
    .sigil {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 0.8s ease 0.3s forwards;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sigil::before, .sigil::after {
      content: '';
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .sigil::after { transform: scaleX(-1); }

    /* ── Main heading ── */
    .headline {
      font-family: var(--mono);
      font-size: clamp(1.8rem, 4.5vw, 3.6rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--ivory);
      text-align: center;
      line-height: 1.2;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.5s forwards;
      margin-bottom: 12px;
    }
    .headline span {
      color: var(--gold);
      font-weight: 500;
    }

    /* ── Subline ── */
    .subline {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.7s forwards;
      margin-bottom: 56px;
      max-width: 480px;
      line-height: 1.7;
    }

    /* ── Search container ── */
    .search-wrap {
      width: 100%;
      max-width: 680px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.9s forwards;
      position: relative;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
    }

    .search-input {
      flex: 1;
      height: 60px;
      background: rgba(10, 10, 11, 0.8);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 6px 0 0 6px;
      padding: 0 22px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ivory);
      outline: none;
      backdrop-filter: blur(20px);
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .search-input::placeholder {
      color: rgba(253, 246, 227, 0.28);
    }
    .search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold), 0 0 28px rgba(245, 166, 35, 0.18);
    }

    .search-btn {
      height: 60px;
      padding: 0 28px;
      background: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 0 6px 6px 0;
      color: #0A0A0B;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .search-btn:hover {
      background: var(--amber);
      box-shadow: 0 0 30px rgba(245, 166, 35, 0.4);
    }
    .search-btn:active { transform: scale(0.98); }
    .search-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    /* ── Scanning state ── */
    .search-input.scanning {
      border-color: var(--gold);
      animation: scanPulse 1.2s ease infinite;
    }
    @keyframes scanPulse {
      0%, 100% { box-shadow: 0 0 0 1px var(--gold), 0 0 10px rgba(245,166,35,0.1); }
      50%       { box-shadow: 0 0 0 1px var(--gold), 0 0 40px rgba(245,166,35,0.4); }
    }

    /* ── Result card ── */
    .result-card {
      width: 100%;
      max-width: 680px;
      margin-top: 20px;
      background: rgba(10, 10, 11, 0.85);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px 24px;
      backdrop-filter: blur(20px);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      font-family: var(--mono);
      font-size: 12px;
    }
    .result-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(245, 166, 35, 0.12);
    }
    .verdict-badge {
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.1em;
    }
    .verdict-ALLOW    { background: rgba(16,185,129,0.15);  color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .verdict-BLOCK    { background: rgba(244,63,94,0.15);   color: #f43f5e; border: 1px solid rgba(244,63,94,0.3); }
    .verdict-ESCALATE { background: rgba(245,158,11,0.15);  color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
    .result-target {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .result-item label {
      display: block;
      color: var(--gold);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .result-item span {
      color: var(--ivory);
      font-size: 13px;
    }
    .result-reason {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(245, 166, 35, 0.12);
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      line-height: 1.6;
    }

    /* ── Footer nav ── */
    .footer-nav {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      z-index: 2;
      opacity: 0;
      animation: fadeUp 0.9s ease 1.3s forwards;
    }
    .footer-link {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-link:hover { color: var(--gold); }

    /* ── Status pill ── */
    .status-pill {
      position: fixed;
      top: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 0.8s ease 1.1s forwards;
      z-index: 2;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      animation: dotPulse 2s ease infinite;
    }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 4px var(--gold); opacity: 1; }
      50%       { box-shadow: 0 0 12px var(--gold); opacity: 0.6; }
    }

    /* ── Logo top-left ── */
    .logo-pill {
      position: fixed;
      top: 24px;
      left: 28px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.08em;
      z-index: 2;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="wave-canvas"></canvas>
  <div class="vignette"></div>

  <div class="logo-pill">SIGUI</div>

  <!-- Status pill -->
  <div class="status-pill">
    <div class="pulse-dot"></div>
    ORACLE LIVE
  </div>

  <!-- Main scene -->
  <div class="scene">
    <div class="sigil">Omnichain Security Oracle</div>

    <h1 class="headline">
      Audit any <span>contract</span><br />before it acts.
    </h1>

    <p class="subline">
      Paste a transaction hash or wallet address.<br />
      Sigui returns a ZK-backed security verdict in under 50ms.
    </p>

    <!-- Search -->
    <div class="search-wrap">
      <form class="search-form" id="auditForm">
        <input
          type="text"
          class="search-input"
          id="auditInput"
          placeholder="0x address · tx hash · contract address"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" class="search-btn" id="auditBtn">
          Audit →
        </button>
      </form>

      <!-- Result -->
      <div class="result-card" id="resultCard">
        <div class="result-header">
          <span class="verdict-badge" id="verdictBadge"></span>
          <span class="result-target" id="resultTarget"></span>
        </div>
        <div class="result-grid">
          <div class="result-item">
            <label>Risk Score</label>
            <span id="riskScore">—</span>
          </div>
          <div class="result-item">
            <label>Latency</label>
            <span id="latencyMs">—</span>
          </div>
          <div class="result-item">
            <label>ZK Proof</label>
            <span id="zkProof">—</span>
          </div>
        </div>
        <div class="result-reason" id="resultReason"></div>
      </div>
    </div>
  </div>

  <!-- Footer nav -->
  <nav class="footer-nav">
    <a href="index.html" class="footer-link">Home</a>
    <a href="https://github.com/ibonon/Sigui" class="footer-link" target="_blank">GitHub</a>
    <a href="https://www.npmjs.com/package/sigui-elizaos-plugin" class="footer-link" target="_blank">NPM</a>
    <a href="http://localhost:3001" class="footer-link" target="_blank">Dashboard</a>
  </nav>

  <script>
    /* ── Wave Canvas ─────────────────────────────────────────────────── */
    (function () {
      const canvas = document.getElementById('wave-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, t = 0;

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const WAVES = [
        { amp: 28, freq: 0.012, speed: 0.008, yBase: 0.55, alpha: 0.18, lw: 1.8 },
        { amp: 18, freq: 0.018, speed: 0.013, yBase: 0.58, alpha: 0.12, lw: 1.2 },
        { amp: 38, freq: 0.008, speed: 0.005, yBase: 0.52, alpha: 0.10, lw: 2.4 },
        { amp: 14, freq: 0.024, speed: 0.019, yBase: 0.62, alpha: 0.08, lw: 1.0 },
        { amp: 50, freq: 0.006, speed: 0.003, yBase: 0.48, alpha: 0.06, lw: 3.0 },
        { amp: 22, freq: 0.015, speed: 0.010, yBase: 0.70, alpha: 0.07, lw: 1.5 },
        { amp: 16, freq: 0.020, speed: 0.016, yBase: 0.40, alpha: 0.06, lw: 1.0 },
        { amp: 44, freq: 0.007, speed: 0.004, yBase: 0.72, alpha: 0.05, lw: 2.0 },
      ];

      function draw() {
        ctx.clearRect(0, 0, W, H);
        t += 1;

        WAVES.forEach(w => {
          ctx.beginPath();
          ctx.moveTo(0, H * w.yBase);

          for (let x = 0; x <= W; x += 3) {
            const y = H * w.yBase
              + Math.sin(x * w.freq + t * w.speed) * w.amp
              + Math.sin(x * w.freq * 0.5 + t * w.speed * 1.7) * w.amp * 0.35;
            ctx.lineTo(x, y);
          }

          ctx.strokeStyle = `rgba(245, 166, 35, ${w.alpha})`;
          ctx.lineWidth = w.lw;
          ctx.stroke();
        });

        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ── Audit Form ──────────────────────────────────────────────────── */
    const API = 'http://127.0.0.1:8000';
    const form    = document.getElementById('auditForm');
    const input   = document.getElementById('auditInput');
    const btn     = document.getElementById('auditBtn');
    const card    = document.getElementById('resultCard');

    const MOCK = {
      drain: {
        decision: 'BLOCK', risk_score: 0.97, processing_time_ms: 38.4,
        zk_proof: '0x8f3b…64b',
        reason: 'CRITICAL: High-outdegree drain-star fanout detected. Destination address flagged on dynamic threat blacklist. Transaction intercepted.',
      },
      mixer: {
        decision: 'ESCALATE', risk_score: 0.64, processing_time_ms: 45.1,
        zk_proof: '0x7a2c…pending',
        reason: 'Multi-hop mixing sequence detected. Routed to Lebe LLM for final approval.',
      },
      safe: {
        decision: 'ALLOW', risk_score: 0.03, processing_time_ms: 31.7,
        zk_proof: '0x4e9f…valid',
        reason: 'Standard transfer topology. No threat signals detected. ZK proof verified on BN128.',
      },
    };

    function showResult(data, target) {
      const decision = (data.decision || 'ESCALATE').toUpperCase();
      const badge = document.getElementById('verdictBadge');
      badge.textContent = decision;
      badge.className = 'verdict-badge verdict-' + decision;
      document.getElementById('resultTarget').textContent = target;
      document.getElementById('riskScore').textContent =
        typeof data.risk_score === 'number' ? (data.risk_score * 100).toFixed(1) + '%' : '—';
      document.getElementById('latencyMs').textContent =
        data.processing_time_ms ? data.processing_time_ms.toFixed(1) + 'ms' : '—';
      document.getElementById('zkProof').textContent = data.zk_proof || '—';
      document.getElementById('resultReason').textContent = data.reason || '';
      card.classList.add('visible');
    }

    function setScanning(active) {
      if (active) {
        input.classList.add('scanning');
        btn.textContent = 'Scanning…';
        btn.disabled = true;
      } else {
        input.classList.remove('scanning');
        btn.textContent = 'Audit →';
        btn.disabled = false;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      card.classList.remove('visible');
      setScanning(true);

      const amountMatch = q.match(/(\d+(\.\d+)?)/);
      const amount = amountMatch ? parseFloat(amountMatch[0]) : Math.random() * 500;

      try {
        const res = await fetch(`${API}/evaluate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action_type: 'transfer',
            destination: q.startsWith('0x') ? q : '0x' + q,
            amount_usdc: amount,
            chain: 'ethereum',
          }),
        });
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        setTimeout(() => { setScanning(false); showResult(data, q); }, 1400);
      } catch {
        const lower = q.toLowerCase();
        let mock = MOCK.safe;
        if (lower.includes('drain') || lower.includes('attack') || lower.includes('bad')) mock = MOCK.drain;
        else if (lower.includes('mix') || lower.includes('tornado') || lower.includes('swap')) mock = MOCK.mixer;
        setTimeout(() => { setScanning(false); showResult(mock, q); }, 1600);
      }
    });
  </script>
</body>
</html>
