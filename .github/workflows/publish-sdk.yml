name: Publish sigui-sdk to PyPI

on:
  push:
    tags:
      - "sdk/v*.*.*"   # e.g.  sdk/v0.2.0

permissions:
  contents: read
  id-token: write   # Required for PyPI Trusted Publishing (OIDC)

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Run tests before publishing
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SDK + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check sigui/

      - name: Run tests
        run: pytest -v

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build the distribution
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build wheel + sdist
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/python/dist/

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Publish to PyPI via Trusted Publishing (no token needed)
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/sigui-sdk

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing: no PYPI_API_TOKEN needed.
        # Configure at https://pypi.org/manage/project/sigui-sdk/settings/publishing/
